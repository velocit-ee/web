<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" role="img" aria-label="Server rack">
  <!-- Server rack frame -->
  <rect x="20" y="10" width="160" height="240" rx="4" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <rect x="30" y="25" width="140" height="3" rx="1" fill="currentColor" opacity="0.8"/>

  <!-- 1U slots (top — green-active) -->
  <g opacity="0.6">
    <rect x="30" y="38" width="140" height="18" rx="2" fill="none" stroke="#22c55e" stroke-width="0.8"/>
    <circle cx="42" cy="47" r="3" fill="#22c55e"/>
    <rect x="52" y="44" width="60" height="6" rx="1" fill="#22c55e" opacity="0.4"/>
    <rect x="148" y="44" width="14" height="6" rx="1" fill="#22c55e" opacity="0.6"/>
  </g>
  <g opacity="0.6">
    <rect x="30" y="62" width="140" height="18" rx="2" fill="none" stroke="#22c55e" stroke-width="0.8"/>
    <circle cx="42" cy="71" r="3" fill="#22c55e"/>
    <rect x="52" y="68" width="80" height="6" rx="1" fill="#22c55e" opacity="0.4"/>
    <rect x="148" y="68" width="14" height="6" rx="1" fill="#22c55e" opacity="0.6"/>
  </g>

  <!-- Middle (blue-active) -->
  <g opacity="0.5">
    <rect x="30" y="86" width="140" height="18" rx="2" fill="none" stroke="#60a5fa" stroke-width="0.8"/>
    <circle cx="42" cy="95" r="3" fill="#60a5fa"/>
    <rect x="52" y="92" width="50" height="6" rx="1" fill="#60a5fa" opacity="0.4"/>
    <rect x="148" y="92" width="14" height="6" rx="1" fill="#60a5fa" opacity="0.6"/>
  </g>
  <g opacity="0.5">
    <rect x="30" y="110" width="140" height="18" rx="2" fill="none" stroke="#60a5fa" stroke-width="0.8"/>
    <circle cx="42" cy="119" r="3" fill="#60a5fa" opacity="0.5"/>
    <rect x="52" y="116" width="30" height="6" rx="1" fill="#60a5fa" opacity="0.3"/>
    <rect x="148" y="116" width="14" height="6" rx="1" fill="#3d4149" opacity="0.8"/>
  </g>

  <!-- Idle slots (dim) -->
  <g opacity="0.3">
    <rect x="30" y="134" width="140" height="18" rx="2" fill="none" stroke="#3d4149" stroke-width="0.8"/>
    <circle cx="42" cy="143" r="3" fill="#fb923c" opacity="0.5"/>
    <rect x="148" y="140" width="14" height="6" rx="1" fill="#3d4149" opacity="0.8"/>
  </g>
  <g opacity="0.3">
    <rect x="30" y="158" width="140" height="18" rx="2" fill="none" stroke="#3d4149" stroke-width="0.8"/>
    <circle cx="42" cy="167" r="3" fill="#fb923c" opacity="0.5"/>
    <rect x="148" y="164" width="14" height="6" rx="1" fill="#3d4149" opacity="0.8"/>
  </g>

  <!-- Console panel (bottom) -->
  <rect x="30" y="190" width="140" height="40" rx="2" fill="none" stroke="#2a2a35" stroke-width="0.8"/>
  <rect x="38" y="198" width="30" height="6" rx="1" fill="#3d4149" opacity="0.6"/>
  <rect x="38" y="210" width="20" height="6" rx="1" fill="#3d4149" opacity="0.6"/>
  <rect x="110" y="198" width="50" height="24" rx="2" fill="#141418" stroke="#2a2a35" stroke-width="0.5"/>
  <text x="135" y="214" text-anchor="middle" fill="#22c55e" font-family="JetBrains Mono, monospace" font-size="8" opacity="0.7">ONLINE</text>
</svg>
